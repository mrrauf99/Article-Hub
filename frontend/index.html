<!doctype html>
<html lang="en" class="h-full overflow-x-hidden">
  <head>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-5T72PSLPM3"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-5T72PSLPM3");
    </script>
    <meta charset="UTF-8" />

    <!-- Favicon (Google Search compliant) -->
    <link rel="icon" href="/favicon.png" sizes="96x96" type="image/png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Title only — every route renders its own <SEO> component (react-helmet-async),
      which sets description/robots/canonical/OG/Twitter tags per page. Duplicating
      those here would create two of each tag once Helmet mounts (react-helmet-async
      only manages tags it renders itself, so it can't replace these static ones).
      This title is just the pre-hydration fallback; Helmet overwrites document.title.
    -->
    <title>Article Hub</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14140F" />

    <style>
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: hidden;
        scroll-behavior: auto;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
        background-color: #f8fafc;
      }
      #root {
        min-height: 100vh;
        width: 100%;
      }
      #modal-root {
        position: relative;
        z-index: 9999;
      }
    </style>
  </head>

  <body class="min-h-screen bg-slate-50 overflow-x-hidden">
    <div id="modal-root"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
